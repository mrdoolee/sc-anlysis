<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>너의 점수는: 중학교 성적 분석 도구(학급 담임용)</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 17l5-5 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div>
            <h1>너의 점수는</h1>
            <p>중학교 성적 분석 도구<br>(학급 담임용)</p>
          </div>
        </div>
        <div class="privacy-card">
          <p class="privacy-title"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>오프라인 · 개인정보보호</p>
          <p class="privacy-sub">데이터는 이 컴퓨터 안에서만 처리<br>(개인 Local Device 전용 동작)</p>
          <button type="button" id="privacy-btn" class="privacy-btn" aria-haspopup="dialog">개인정보보호 안내 보기</button>
        </div>
        <nav id="nav" aria-label="단계"></nav>
        <div class="sidebar-foot">
          <button type="button" id="manual-btn" class="manual-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z M9 20a4 4 0 0 1-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            사용 설명서
          </button>
          <button type="button" id="clear-all" class="button-ghost danger">데이터 모두 지우기</button>
        </div>
      </aside>
      <div class="content">
        <header class="topbar" id="topbar"></header>
        <main id="app"></main>
        <footer class="app-footer">
          <p>© 2026 Designed &amp; Developed by <button type="button" class="credit-link" id="credit-link" aria-haspopup="dialog">두리쌤</button>. All rights reserved.</p>
        </footer>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
